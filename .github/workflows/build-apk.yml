name: Build SAMP Mobile APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK & CMake
        run: |
          echo "Installing Android NDK 26.2.11394342..."
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Prepare Keystore Directory & Generate Keystore
        run: |
          mkdir -p ../keys
          mkdir -p ../../keys
          keytool -genkeypair -v \
            -keystore ../keys/new.jks \
            -alias key0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123123 \
            -keypass 123123 \
            -dname "CN=SAMP Mobile, OU=Gaming, O=Community, L=Jakarta, ST=Jakarta, C=ID"
          cp ../keys/new.jks ../../keys/new.jks || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == null }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' || github.event.inputs.build_type == null }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename and Prepare APKs
        run: |
          mkdir -p output-apks
          if [ -d "app/build/outputs/apk/debug" ]; then
            find app/build/outputs/apk/debug -name "*.apk" -exec cp {} output-apks/SAMP-Mobile-GTA210-Debug.apk \;
          fi
          if [ -d "app/build/outputs/apk/release" ]; then
            find app/build/outputs/apk/release -name "*.apk" -exec cp {} output-apks/SAMP-Mobile-GTA210-Release.apk \;
          fi
          ls -la output-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SAMP-Mobile-APKs
          path: output-apks/*.apk
          retention-days: 14

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
